name: flutter_floating_bottom_bar_example
description: Example app for flutter_floating_bottom_bar.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_floating_bottom_bar:
    path: ../

  # Upper bounds mirror the parent package: material_ui 1.3.0 and
  # cupertino_ui 1.1.0 need a newer Dart than Flutter 3.44.4 ships.
  material_ui: ">=1.0.0 <1.3.0"
  cupertino_ui: ">=1.0.0 <1.1.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

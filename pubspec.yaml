name: flutter_floating_bottom_bar
description: An adaptable Flutter floating bottom bar for navigation, search, and custom widgets, with scroll-aware visibility and accessible interactions.
version: 3.0.0
homepage: https://hashstudios.in
repository: https://github.com/codenameakshay/flutter-floating-bottom-bar

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Upper bounds are pinned because material_ui 1.3.0 and cupertino_ui 1.1.0
  # use @awaitNotRequired, which the Dart shipped with Flutter 3.44.4
  # cannot compile. Revert to open ranges after bumping past Flutter 3.44.
  material_ui: ">=1.0.0 <1.3.0"
  cupertino_ui: ">=1.0.0 <1.1.0"
  motor: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.44.4', '3.47.0']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ matrix.flutter }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub upgrade

      - name: Install example dependencies
        working-directory: example
        run: flutter pub upgrade

      - name: Run quality checks
        run: make check FLUTTER=flutter DART=dart

      - name: Validate pub publish archive
        run: flutter pub publish --dry-run

  goldens:
    # Goldens render and are checked only here, on the pinned Linux image that
    # `make goldens` uses locally.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Name the pinned golden image
        id: image
        run: echo "tag=ffbb-goldens:$(git hash-object tool/goldens/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the pinned golden image
        uses: docker/build-push-action@v6
        with:
          context: tool/goldens
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}
          load: true
          cache-from: type=gha,scope=goldens
          cache-to: type=gha,mode=max,scope=goldens

      - name: Test the golden tooling
        run: make goldens-tooling

      - name: Check goldens
        run: make goldens

      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/goldens/failures/
          if-no-files-found: ignore

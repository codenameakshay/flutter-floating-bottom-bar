name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check tag, pubspec and changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')"
          if [ "$version" != "$pubspec_version" ]; then
            echo "::error::Tag $TAG does not match pubspec.yaml version $pubspec_version."
            exit 1
          fi
          if ! grep -qxF "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi

      - name: Set up Dart (pub.dev OIDC token)
        uses: dart-lang/setup-dart@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Publish
        run: flutter pub publish --force
